<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub - Responsive Register (Practical 3)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>CHARUSAT StudentHub</h1>
    <p>Faculty of Technology and Engineering</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="events.html">Events</a>
    <a href="register.html" class="active">Register</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>

  <div class="container">
    <div class="card-box" style="max-width: 600px; margin: auto;">
      <h2>Student Registration Form</h2>
      <p style="margin-bottom: 15px; color: #666; font-size: 13px;">Using responsive Flexbox form rows that stack on mobile screens.</p>

      <form action="dashboard.html" method="get">
        <!-- Responsive row: 2 columns on laptop, 1 column on mobile -->
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="e.g. Diya Sharma">
          </div>
          <div class="form-group">
            <label for="email">College Email</label>
            <input type="email" id="email" required placeholder="diya@charusat.edu.in">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" required placeholder="9876543210">
          </div>
          <div class="form-group">
            <label for="course">Branch</label>
            <select id="course" required>
              <option value="IT">Information Technology</option>
              <option value="CSE">Computer Science &amp; Engg</option>
              <option value="CE">Computer Engineering</option>
              <option value="EC">Electronics &amp; Comm</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="pass">Password</label>
            <input type="password" id="pass" required placeholder="At least 8 characters">
          </div>
          <div class="form-group">
            <label for="cpass">Confirm Password</label>
            <input type="password" id="cpass" required placeholder="Re-enter password">
          </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Submit Registration</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 CHARUSAT FTE.</p>
  </footer>

</body>
</html>
