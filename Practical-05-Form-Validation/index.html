<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 5 - Client-Side Form Validation | StudentHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="form-container">
    <h2>Student Registration Form</h2>
    
    <!-- Success Banner -->
    <div id="successMessage" class="success-message"></div>

    <form id="registrationForm" novalidate>
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" name="fullName" placeholder="e.g. Rahul Patel">
        <div id="nameError" class="error-msg"></div>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="e.g. rahul@charusat.edu.in">
        <div id="emailError" class="error-msg"></div>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label for="mobile">Mobile Number <span class="required">*</span></label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number">
        <div id="mobileError" class="error-msg"></div>
      </div>

      <!-- Department -->
      <div class="form-group">
        <label for="department">Department <span class="required">*</span></label>
        <select id="department" name="department">
          <option value="">-- Select Department --</option>
          <option value="IT">Information Technology (IT)</option>
          <option value="CE">Computer Engineering (CE)</option>
          <option value="CSE">Computer Science &amp; Engg (CSE)</option>
          <option value="EC">Electronics &amp; Comm (EC)</option>
          <option value="ME">Mechanical Engineering (ME)</option>
        </select>
        <div id="deptError" class="error-msg"></div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" placeholder="At least 8 chars, 1 number, 1 special char">
        <div class="strength-bar-container">
          <div id="strengthBar" class="strength-bar"></div>
        </div>
        <div id="strengthText" class="strength-text"></div>
        <div id="passError" class="error-msg"></div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
        <div id="confirmPassError" class="error-msg"></div>
      </div>

      <!-- CAPTCHA -->
      <div class="form-group">
        <label>Security CAPTCHA <span class="required">*</span></label>
        <div class="captcha-box">
          <canvas id="captcha-canvas" width="120" height="36"></canvas>
          <button type="button" id="btnRefreshCaptcha" class="btn-refresh">Refresh</button>
        </div>
        <input type="text" id="captchaInput" name="captchaInput" placeholder="Enter CAPTCHA text shown above">
        <div id="captchaError" class="error-msg"></div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">Submit Registration</button>
      
    </form>
  </div>

  <script src="js/validate.js"></script>
</body>
</html>
